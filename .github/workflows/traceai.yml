name: TraceAI PR Summary

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  update-pr:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Check for TraceAI config
        id: check
        run: |
          if [ -f .traceai/config.json ]; then
            GIST_URL=$(jq -r '.gist_url' .traceai/config.json)
            GIST_ID=$(jq -r '.gist_id' .traceai/config.json)
            BRANCH=$(jq -r '.branch' .traceai/config.json)

            echo "gist_url=$GIST_URL" >> $GITHUB_OUTPUT
            echo "gist_id=$GIST_ID" >> $GITHUB_OUTPUT
            echo "branch=$BRANCH" >> $GITHUB_OUTPUT
            echo "found=true" >> $GITHUB_OUTPUT
            echo "✅ Found TraceAI config: $GIST_URL"
          else
            echo "found=false" >> $GITHUB_OUTPUT
            echo "⚠️  No TraceAI config found (.traceai/config.json missing)"
          fi

      - name: Setup Python
        if: steps.check.outputs.found == 'true'
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install TraceAI
        if: steps.check.outputs.found == 'true'
        run: |
          cd pipeline
          pip install -e . --quiet

      - name: Download artifact from Gist
        if: steps.check.outputs.found == 'true'
        run: |
          GIST_ID="${{ steps.check.outputs.gist_id }}"

          echo "📥 Downloading conversation from Gist $GIST_ID..."

          # Fetch Gist content using GitHub API
          curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/gists/$GIST_ID" | \
            jq -r '.files["conversation.json"].content' > artifact.json

          if [ ! -s artifact.json ]; then
            echo "❌ Failed to download artifact from Gist"
            exit 1
          fi

          echo "✅ Downloaded artifact successfully"

      - name: Generate PR comment summary
        if: steps.check.outputs.found == 'true'
        id: summary
        run: |
          echo "📝 Generating PR summary from artifact..."

          # Parse artifact to extract stats
          TOTAL_PROMPTS=$(jq -r '.stats.total_prompts' artifact.json)
          FILES_MODIFIED=$(jq -r '.stats.files_modified' artifact.json)
          TOTAL_MESSAGES=$(jq -r '.stats.total_messages' artifact.json)
          MAPPINGS_COUNT=$(jq '.mappings | length' artifact.json)

          # Get file list with their prompts
          FILES_LIST=$(jq -r '.mappings | group_by(.file) | map({file: .[0].file, count: length}) | .[] | "- `\(.file)` (\(.count) change\(if .count > 1 then "s" else "" end))"' artifact.json)

          # Create comment body
          cat > pr-comment.md << 'EOF'
          ## 🤖 AI-Generated Code Summary

          This PR was developed in collaboration with Claude Code.

          ### 📊 Statistics
          - **Prompts**: $TOTAL_PROMPTS
          - **Messages**: $TOTAL_MESSAGES
          - **Files Modified**: $FILES_MODIFIED
          - **Code Mappings**: $MAPPINGS_COUNT

          ### 📝 Files Modified by AI
          $FILES_LIST

          ### 🔗 Full Conversation
          [View complete conversation on GitHub Gist](${{ steps.check.outputs.gist_url }})

          > **Tip**: Install the [TraceAI VSCode extension](https://github.com/umarkhan135/TraceAI/tree/main/extension) to see which prompt generated each line of code by hovering over it!

          ---
          *Generated by [TraceAI](https://github.com/umarkhan135/TraceAI) for branch `${{ steps.check.outputs.branch }}`*
          EOF

          # Replace variables (using temporary file for cross-platform compatibility)
          sed "s|\$TOTAL_PROMPTS|$TOTAL_PROMPTS|g" pr-comment.md > pr-comment.tmp && mv pr-comment.tmp pr-comment.md
          sed "s|\$TOTAL_MESSAGES|$TOTAL_MESSAGES|g" pr-comment.md > pr-comment.tmp && mv pr-comment.tmp pr-comment.md
          sed "s|\$FILES_MODIFIED|$FILES_MODIFIED|g" pr-comment.md > pr-comment.tmp && mv pr-comment.tmp pr-comment.md
          sed "s|\$MAPPINGS_COUNT|$MAPPINGS_COUNT|g" pr-comment.md > pr-comment.tmp && mv pr-comment.tmp pr-comment.md
          sed "s|\$FILES_LIST|$FILES_LIST|g" pr-comment.md > pr-comment.tmp && mv pr-comment.tmp pr-comment.md

          echo "✅ Generated PR comment"

      - name: Post comment on PR
        if: steps.check.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "💬 Posting comment on PR #${{ github.event.pull_request.number }}..."

          # Check if we already commented
          EXISTING_COMMENT=$(gh pr view ${{ github.event.pull_request.number }} --json comments --jq '.comments[] | select(.body | contains("🤖 AI-Generated Code Summary")) | .id' | head -1)

          if [ -n "$EXISTING_COMMENT" ]; then
            echo "Found existing TraceAI comment (ID: $EXISTING_COMMENT), updating..."
            # Note: GitHub CLI doesn't support editing comments directly via gh pr comment
            # We'll delete and recreate instead
            gh api -X DELETE "/repos/${{ github.repository }}/issues/comments/$EXISTING_COMMENT"
          fi

          # Post new comment
          gh pr comment ${{ github.event.pull_request.number }} --body-file pr-comment.md

          echo "✅ Posted TraceAI summary comment on PR"
